<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121210"><title>CampusLink Taza</title><style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121210;color:#f7f4ee;font:16px/1.7 system-ui,sans-serif;padding:24px}main{width:min(380px,100%);text-align:center}img{border-radius:18px}h1{font-size:23px;line-height:1.3}p{color:#aaa59b}button{min-height:46px;padding:10px 22px;border:0;border-radius:10px;background:#e6c39a;color:#25221e;font:600 14px system-ui;cursor:pointer}@media(prefers-color-scheme:light){:root{color-scheme:light}body{background:#f7f5f1;color:#25221e}p{color:#746f67}button{background:#9e6749;color:#fff}}
  </style></head><body><main><img src="/icons/app-192.png" alt="" width="72" height="72"><h1 id="title">Vous êtes hors connexion</h1><p id="description">Reconnectez-vous pour retrouver vos cours et discussions.</p><button id="retry" type="button">Réessayer</button></main><script>
  const heading=document.getElementById('title'),message=document.getElementById('description'),button=document.getElementById('retry');
  try {const theme=JSON.parse(localStorage.getItem('campuslink-prototype-v1:theme'));if(theme==='light'||theme==='dark'){const light=theme==='light';document.documentElement.style.colorScheme=theme;document.body.style.background=light?'#f7f5f1':'#121210';document.body.style.color=light?'#25221e':'#f7f4ee';message.style.color=light?'#746f67':'#aaa59b';button.style.background=light?'#9e6749':'#e6c39a';button.style.color=light?'#ffffff':'#25221e';}const lang=JSON.parse(localStorage.getItem('campuslink-prototype-v1:language'));if(lang==='en'){document.documentElement.lang='en';heading.textContent='You are offline';message.textContent='Reconnect to open your courses and discussions.';button.textContent='Try again';}if(lang==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';heading.textContent='أنت غير متصل بالإنترنت';message.textContent='أعد الاتصال للوصول إلى دروسك ونقاشاتك.';button.textContent='إعادة المحاولة';}}catch{}button.addEventListener('click',()=>location.reload());
  </script></body></html>
